name: Feature request
description: Suggest a change to the CLI, menu bar, or MCP tools
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues
          required: true
        - label: This stays on-device. No telemetry or cloud relay.
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - mf CLI
        - Menu bar
        - MCP
        - Install
        - Docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
